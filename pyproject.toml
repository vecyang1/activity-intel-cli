[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-intel"
# Single-sourced from activityintel/__init__.py. See the note there.
dynamic = ["version"]
description = "Bookable activity and experience intelligence across OTA platforms — robots-gated, cache-first, and honest about coverage."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Vec Yang" }]
keywords = ["travel", "airbnb", "klook", "viator", "experiences", "cli", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Utilities",
]
# Standard library only. That is a property worth keeping, not an accident.
dependencies = []

[project.optional-dependencies]
# Not a dependency of the code — a repair for a broken interpreter. A python.org
# framework build whose `Install Certificates.command` was never run loads ZERO
# CA certificates, and every https call then dies with CERTIFICATE_VERIFY_FAILED
# for reasons that have nothing to do with this tool. `config.ssl_context()`
# falls back to certifi when the default store is empty; install this extra if
# `activity-intel doctor` reports the trust store as unusable.
tls = ["certifi"]

[project.urls]
Homepage = "https://github.com/vecyang1/activity-intel-cli"
Issues = "https://github.com/vecyang1/activity-intel-cli/issues"
Changelog = "https://github.com/vecyang1/activity-intel-cli/blob/main/CHANGELOG.md"

[project.scripts]
activity-intel = "activityintel.cli:main"

[tool.setuptools.dynamic]
version = { attr = "activityintel.__version__" }

[tool.setuptools.packages.find]
# Ship the package only. `tests` and `tools` are development surfaces: a wheel
# that installs a top-level `tests` module claims that name for every project in
# the environment.
include = ["activityintel*"]
